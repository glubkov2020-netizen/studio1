<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
        /* ============================================================
           СТИЛИ АДМИНКИ (премиум, тёмная, адаптивная)
           ============================================================ */
        :root {
            --bg-primary: #0D0D0D;
            --bg-secondary: #161616;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #F0EBE6;
            --text-secondary: #D0CBC6;
            --text-muted: #8A8580;
            --border-color: rgba(201, 169, 110, 0.15);
            --border-hover: rgba(201, 169, 110, 0.3);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 40px rgba(201, 169, 110, 0.1);
            --gold: #C9A96E;
            --gold-dark: #B8974D;
            --gold-light: #E8D5A8;
            --gold-gradient: linear-gradient(135deg, #C9A96E, #E8D5A8, #C9A96E);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --radius: 16px;
            --radius-sm: 12px;
            --header-height: 0px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            background: var(--bg-primary), radial-gradient(ellipse at 15% 25%, rgba(201, 169, 110, 0.12) 0%, transparent 55%), radial-gradient(ellipse at 85% 70%, rgba(201, 169, 110, 0.08) 0%, transparent 50%);
            animation: floatingGradients 18s ease-in-out infinite alternate;
        }
        @keyframes floatingGradients {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: .7
            }
            50% {
                transform: scale(1.05) rotate(1deg);
                opacity: .9
            }
            100% {
                transform: scale(1.03) rotate(-1deg);
                opacity: .75
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-radius: var(--radius);
            padding: 24px 20px;
        }
        .glass-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-hover);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            min-height: 40px;
            background: var(--gold-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(201, 169, 110, 0.3);
            background-size: 200% auto;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 169, 110, 0.4);
            background-position: right center;
        }
        .btn-outline {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--gold);
            color: #fff;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            min-height: 32px;
        }
        .btn-danger {
            background: #E74C3C;
            box-shadow: 0 4px 24px rgba(231, 76, 60, 0.3);
        }
        .btn-danger:hover {
            background: #C0392B;
        }
        .btn-success {
            background: #27AE60;
            box-shadow: 0 4px 24px rgba(39, 174, 96, 0.3);
        }
        .btn-success:hover {
            background: #219A52;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .admin-header h2 {
            font-size: 28px;
        }
        .admin-header .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .admin-header .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0 16px;
            margin-bottom: 20px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .admin-tabs::-webkit-scrollbar {
            display: none;
        }
        .admin-tab {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .admin-tab:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .admin-tab.active {
            background: var(--gold-gradient);
            color: #fff;
            border-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            text-align: center;
            transition: var(--transition);
        }
        .stat-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .stat-card .stat-icon {
            font-size: 28px;
            color: var(--gold);
        }
        .stat-card .stat-number {
            font-weight: 700;
            font-size: 20px;
            margin-top: 4px;
        }
        .stat-card .stat-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .admin-table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        .admin-table th {
            text-align: left;
            padding: 10px 12px;
            color: var(--gold);
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
            white-space: nowrap;
        }
        .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        .admin-table tr:hover td {
            background: var(--bg-card-hover);
        }
        .admin-table .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .admin-table .actions .btn {
            padding: 4px 10px;
            font-size: 11px;
            min-height: 28px;
        }
        .admin-table input,
        .admin-table select {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
            transition: var(--transition);
            min-width: 60px;
        }
        .admin-table input:focus,
        .admin-table select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .service-row {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
        }
        .service-row input {
            flex: 1;
            min-width: 50px;
            padding: 4px 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
        }
        .service-row .btn {
            padding: 2px 8px;
            font-size: 10px;
            min-height: 24px;
        }

        .add-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .add-form input,
        .add-form textarea {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }
        .add-form input:focus,
        .add-form textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        .add-form textarea {
            min-height: 80px;
            width: 100%;
        }
        .add-form .btn {
            flex-shrink: 0;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--bg-primary);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 28px 24px 24px;
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
            animation: modalSlideUp 0.35s ease forwards;
        }
        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(30px)
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            font-size: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            z-index: 10;
            padding: 8px;
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
            transform: rotate(90deg);
        }
        .modal h2 {
            font-size: clamp(22px, 5vw, 28px);
            margin-bottom: 4px;
            color: var(--text-primary);
            padding-right: 48px;
        }
        .modal .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .modal .subtitle {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 14px;
        }
        .modal .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .modal .info-row .label {
            color: var(--text-muted);
            font-weight: 500;
        }
        .modal .info-row .value {
            color: var(--text-primary);
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .modal .history-list {
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .modal .history-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }
        .modal .history-item .spent {
            color: #E74C3C;
        }
        .modal .history-item .added {
            color: #27AE60;
        }

        .search-box {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--gold);
        }

        @media (max-width:768px) {
            body {
                padding: 12px;
            }
            .glass-card {
                padding: 16px 14px;
            }
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .admin-header .admin-actions {
                width: 100%;
            }
            .admin-header .admin-actions .btn {
                flex: 1;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .stat-card {
                padding: 12px;
            }
            .stat-card .stat-number {
                font-size: 18px;
            }
            .admin-table {
                font-size: 12px;
                min-width: 500px;
            }
            .admin-table td,
            .admin-table th {
                padding: 6px 8px;
            }
            .add-form {
                flex-direction: column;
            }
            .add-form input,
            .add-form textarea {
                min-width: 100%;
            }
            .modal {
                padding: 20px 16px;
            }
            .admin-tab {
                font-size: 12px;
                padding: 6px 14px;
            }
        }
        @media (max-width:480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card .stat-number {
                font-size: 16px;
            }
            .stat-card .stat-icon {
                font-size: 22px;
            }
            .admin-table {
                font-size: 11px;
                min-width: 400px;
            }
            .admin-table td,
            .admin-table th {
                padding: 4px 6px;
            }
            .admin-table .actions .btn {
                font-size: 10px;
                padding: 2px 8px;
                min-height: 24px;
            }
            .modal .info-row {
                font-size: 13px;
            }
            .admin-header h2 {
                font-size: 22px;
            }
        }
        @media (min-width:1024px) {
            .stats-grid {
                grid-template-columns: repeat(5, 1fr);
            }
            .admin-table {
                min-width: 100%;
            }
        }
    </style>
</head>

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        async function initData() {
            try {
                const mastersSnap = await getDocs(collection(db, 'masters'));
                if (mastersSnap.empty) {
                    for (const m of DEFAULT_MASTERS) {
                        await setDoc(doc(db, 'masters', m.id), m);
                    }
                    allMasters = DEFAULT_MASTERS;
                } else {
                    allMasters = [];
                    mastersSnap.forEach(d => allMasters.push({ id: d.id, ...d.data() }));
                }
            } catch (e) {
                allMasters = DEFAULT_MASTERS;
            }

            allServices = [];
            allMasters.forEach(m => {
                if (m.services) {
                    m.services.forEach(s => {
                        allServices.push({ ...s, masterName: m.name, masterId: m.id });
                    });
                }
            });

            try {
                const blogSnap = await getDocs(query(collection(db, 'blog'), orderBy('date', 'desc')));
                allBlogPosts = [];
                blogSnap.forEach(d => allBlogPosts.push({ id: d.id, ...d.data() }));
            } catch (e) {
                allBlogPosts = [];
            }

            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                allUsers = [];
                usersSnap.forEach(d => allUsers.push({ id: d.id, ...d.data() }));
            } catch (e) {
                allUsers = [];
            }

            switchTab('dashboard');
        }

        // ============================================================

        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.admin-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            renderContent(tab);
        };

        async function renderContent(tab) {
            const container = document.getElementById('adminContent');
            switch (tab) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    break;
                case 'masters':
                    container.innerHTML = renderMasters();
                    break;
                case 'blog':
                    container.innerHTML = renderBlog();
                    break;
                case 'clients':
                    container.innerHTML = renderClients();
                    break;
                default:
                    container.innerHTML = '<p>Раздел в разработке</p>';
            }
        }

            const duration = document.getElementById(`newServiceDuration_${masterId}`).value.trim() || '1 ч';
            if (!name) { alert('Введите название'); return; }
            const master = allMasters.find(m => m.id === masterId);
            if (!master) return;
            const services = master.services || [];
            services.push({ name, category, price, duration });
            await updateDoc(doc(db, 'masters', masterId), { services });
            await initData();
            renderContent('masters');
        };

        window.removeService = async function(masterId, index) {
            const master = allMasters.find(m => m.id === masterId);
            if (!master) return;
            if (!confirm(`Удалить "${master.services[index].name}"?`)) return;
            const services = master.services.filter((_, i) => i !== index);
            await updateDoc(doc(db, 'masters', masterId), { services });
            await initData();
            renderContent('masters');

        window.addBlog = async function() {
            const title = document.getElementById('newBlogTitle').value.trim();
            const content = document.getElementById('newBlogContent').value.trim();
            const fileInput = document.getElementById('newBlogImage');
            if (!title || !content) { alert('Заполните заголовок и текст'); return; }

            let imageUrl = '';

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const storageRef = ref(storage, 'blog/' + Date.now() + '_' + file.name);
                try {
                    const snapshot = await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(snapshot.ref);
                } catch (e) {
                    alert('Ошибка загрузки фото: ' + e.message);
                    return;
                }
            }

            await addDoc(collection(db, 'blog'), {
                title,
                content,
                image: imageUrl,
                date: new Date().toISOString()
            });

            await initData();
            renderContent('blog');
            document.getElementById('newBlogTitle').value = '';
            document.getElementById('newBlogContent').value = '';
            document.getElementById('newBlogImage').value = '';
            document.getElementById('blogFileName').textContent = 'Файл не выбран';
        };

        window.addMinutes = async function(userId) {
            const amount = prompt('Сколько минут добавить?', '30');
            if (!amount) return;
            const num = parseInt(amount);
            if (isNaN(num) || num <= 0) { alert('Введите число > 0'); return; }

            const userRef = doc(db, 'users', userId);
            const userSnap = await getDoc(userRef);
            const userData = userSnap.data();
            const newMinutes = (userData.minutes || 0) + num;
            const history = userData.history || [];
            history.push({
                date: new Date().toISOString(),
                action: `Пополнение на ${num} мин`,
                added: num,
                remaining: newMinutes
            });

            await updateDoc(userRef, { minutes: newMinutes, history });
            await initData();
            renderContent('clients');
        };

        window.spendMinutes = async function(userId) {
            const userRef = doc(db, 'users', userId);
            const userSnap = await getDoc(userRef);
            const userData = userSnap.data();
            const current = userData.minutes || 0;

            if (current <= 0) { alert('У клиента 0 минут. Сначала пополните баланс.'); return; }

            const amount = prompt(`Списать минут (доступно: ${current})`, '10');
            if (!amount) return;
            const num = parseInt(amount);
            if (isNaN(num) || num <= 0) { alert('Введите число > 0'); return; }
            if (num > current) { alert(`Недостаточно минут. Доступно: ${current}`); return; }

            const newMinutes = current - num;
            const history = userData.history || [];
            history.push({
                date: new Date().toISOString(),
                action: `Списание ${num} мин (солярий)`,
                spent: num,
                remaining: newMinutes
            });

            await updateDoc(userRef, { minutes: newMinutes, history });
            await initData();
            renderContent('clients');
        };

        // ============================================================
        // УТИЛИТЫ
        // ============================================================
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try { return new Date(dateStr).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit',
                    year: 'numeric' }); } catch { return dateStr; }
        }

        // ============================================================
        // ЗАПУСК
