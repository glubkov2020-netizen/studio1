<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Админка — Студия №1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
        }
    }
    </script>

    <style>
        :root {
            --bg-primary: #0D0D0D;
            --bg-secondary: #161616;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #F0EBE6;
            --text-secondary: #D0CBC6;
            --text-muted: #8A8580;
            --border-color: rgba(201, 169, 110, 0.15);
            --border-hover: rgba(201, 169, 110, 0.3);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 40px rgba(201, 169, 110, 0.1);
            --gold: #C9A96E;
            --gold-gradient: linear-gradient(135deg, #C9A96E, #E8D5A8, #C9A96E);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --radius: 16px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
            background: var(--bg-primary), 
                        radial-gradient(ellipse at 15% 25%, rgba(201, 169, 110, 0.12) 0%, transparent 55%),
                        radial-gradient(ellipse at 85% 70%, rgba(201, 169, 110, 0.08) 0%, transparent 50%);
            animation: floatingGradients 18s ease-in-out infinite alternate;
        }

        @keyframes floatingGradients {
            0% { transform: scale(1) rotate(0deg); opacity: .7; }
            50% { transform: scale(1.05) rotate(1deg); opacity: .9; }
            100% { transform: scale(1.03) rotate(-1deg); opacity: .75; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-radius: var(--radius);
            padding: 24px 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            min-height: 40px;
            background: var(--gold-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(201, 169, 110, 0.3);
            background-size: 200% auto;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(201, 169, 110, 0.4); background-position: right center; }
        .btn-outline { background: transparent; color: var(--gold); border: 2px solid var(--gold); box-shadow: none; }
        .btn-outline:hover { background: var(--gold); color: #fff; }
        .btn-sm { padding: 6px 14px; font-size: 12px; min-height: 32px; }
        .btn-danger { background: #E74C3C; }
        .btn-success { background: #27AE60; }

        .login-page { display: flex; align-items: center; justify-content: center; min-height: 80vh; width: 100%; }
        .login-box { max-width: 420px; width: 100%; padding: 40px 32px; text-align: center; }
        .login-box .icon { font-size: 56px; color: var(--gold); display: block; margin-bottom: 12px; }
        .login-box h2 { font-size: 28px; margin-bottom: 4px; }
        .login-box .gold-text { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .login-box .subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
        .login-box input {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 16px;
        }
        .login-box input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.12); }
        .login-box .error { color: #E74C3C; font-size: 14px; margin-top: 8px; display: none; }
        .login-box .attempts { color: #F1C40F; font-size: 13px; margin-top: 6px; display: none; }
        .login-box .back-link {
            display: block;
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
        }
        .login-box .back-link:hover { color: var(--gold); }

        .admin-panel { display: none; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .admin-header h2 { font-size: 28px; }
        .admin-header .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .admin-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0 16px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .admin-tabs::-webkit-scrollbar { display: none; }
        .admin-tab {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .admin-tab:hover { border-color: var(--gold); color: var(--gold); }
        .admin-tab.active { background: var(--gold-gradient); color: #fff; border-color: transparent; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 20px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            text-align: center;
            transition: var(--transition);
        }
        .stat-card:hover { border-color: var(--gold); transform: translateY(-4px); }
        .stat-card .stat-icon { font-size: 32px; color: var(--gold); display: block; margin-bottom: 6px; }
        .stat-card .stat-number { font-weight: 700; font-size: 24px; color: var(--gold); }
        .stat-card .stat-label { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

        .admin-table-wrapper { overflow-x: auto; }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        .admin-table th {
            text-align: left;
            padding: 10px 12px;
            color: var(--gold);
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
            white-space: nowrap;
        }
        .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        .admin-table tr:hover td { background: var(--bg-card-hover); }
        .admin-table input, .admin-table select {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
        }

        .service-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 12px; }
        .service-row input {
            flex: 1;
            min-width: 50px;
            padding: 4px 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
        }
        .service-row .btn { padding: 2px 8px; font-size: 10px; min-height: 24px; }

        .add-form { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .add-form input, .add-form textarea {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
        }
        .add-form input:focus, .add-form textarea:focus { outline: none; border-color: var(--gold); }

        .blog-posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .blog-post-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
        }
        .blog-post-card:hover { border-color: var(--gold); transform: translateY(-4px); }
        .blog-post-card .post-image { width: 100%; height: 200px; object-fit: cover; background: var(--bg-secondary); }
        .blog-post-card .post-image-placeholder { width: 100%; height: 200px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
        .blog-post-card .post-body { padding: 16px; }
        .blog-post-card .post-body .post-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .blog-post-card .post-body .post-date { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .blog-post-card .post-body .post-excerpt { font-size: 14px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .blog-post-card .post-body .post-status {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 10px;
        }
        .blog-post-card .post-body .post-status.published { background: rgba(39, 174, 96, 0.2); color: #27AE60; }
        .blog-post-card .post-body .post-status.draft { background: rgba(231, 76, 60, 0.2); color: #E74C3C; }
        .blog-post-card .post-actions { padding: 12px 16px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .blog-post-card .post-actions .btn { flex: 1; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-primary);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 28px 24px 24px;
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
            animation: modalSlideUp 0.35s ease forwards;
        }
        @keyframes modalSlideUp {
            from { opacity: 0; transform: scale(0.96) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            font-size: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            z-index: 10;
            padding: 8px;
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: var(--gold); color: #fff; transform: rotate(90deg); }
        .modal h2 { font-size: clamp(22px, 5vw, 28px); margin-bottom: 4px; padding-right: 48px; }
        .modal .gold-text { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal .subtitle { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        .modal .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .modal .info-row .label { color: var(--text-muted); font-weight: 500; }
        .modal .info-row .value { color: var(--text-primary); font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
        .modal .history-list { margin-top: 12px; max-height: 300px; overflow-y: auto; }
        .modal .history-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .search-box { margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
        }

        .comments-table-wrapper { overflow-x: auto; }
        .comments-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 700px;
        }
        .comments-table th {
            text-align: left;
            padding: 10px 12px;
            color: var(--gold);
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
            white-space: nowrap;
        }
        .comments-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        .comments-table tr:hover td { background: var(--bg-card-hover); }
        .comments-table .comment-text-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .comments-table .user-info { display: flex; align-items: center; gap: 8px; }
        .comments-table .user-info .avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .comments-table .user-info .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .comments-table .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }
        .comments-table .badge.deleted { background: rgba(231, 76, 60, 0.15); color: #E74C3C; }
        .comments-table .badge.active { background: rgba(39, 174, 96, 0.15); color: #27AE60; }

        .post-filter { margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .post-filter select {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            min-width: 200px;
        }

        .reviews-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .review-rating-stars { color: #F5B342; font-size: 16px; letter-spacing: 2px; }

        .avatar-cell {
            width: 36px; height: 36px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        .avatar-cell img { width: 100%; height: 100%; object-fit: cover; }

        .user-cell { display: flex; align-items: center; gap: 10px; }

        @media (max-width:768px) {
            body { padding: 12px; }
            .glass-card { padding: 16px 14px; }
            .admin-header { flex-direction: column; align-items: flex-start; }
            .admin-header .admin-actions { width: 100%; }
            .admin-header .admin-actions .btn { flex: 1; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 12px; }
            .stat-card .stat-number { font-size: 20px; }
            .admin-table { font-size: 12px; min-width: 500px; }
            .admin-table td, .admin-table th { padding: 6px 8px; }
            .add-form { flex-direction: column; }
            .add-form input, .add-form textarea { min-width: 100%; }
            .modal { padding: 20px 16px; }
            .admin-tab { font-size: 12px; padding: 6px 14px; }
            .login-box { padding: 28px 20px; }
            .blog-posts-grid { grid-template-columns: 1fr; }
            .comments-table { font-size: 12px; min-width: 500px; }
            .reviews-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
            .post-filter { flex-direction: column; align-items: stretch; }
            .post-filter select { width: 100%; }
        }
        @media (max-width:480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card .stat-number { font-size: 18px; }
            .stat-card .stat-icon { font-size: 24px; }
            .admin-table { font-size: 11px; min-width: 400px; }
            .admin-header h2 { font-size: 22px; }
            .login-box h2 { font-size: 24px; }
            .login-box .icon { font-size: 44px; }
            .comments-table { font-size: 11px; min-width: 400px; }
            .reviews-stats { grid-template-columns: 1fr; }
        }
        @media (min-width:1024px) {
            .stats-grid { grid-template-columns: repeat(6, 1fr); }
            .admin-table { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div id="loginPage" class="login-page">
            <div class="glass-card login-box">
                <i class="fas fa-crown icon"></i>
                <h2>Вход в <span class="gold-text">админку</span></h2>
                <p class="subtitle">Введите логин и пароль</p>
                <form id="adminLoginForm" onsubmit="adminLogin(event)">
                    <input type="text" id="adminLoginInput" placeholder="Логин" required />
                    <input type="password" id="adminPasswordInput" placeholder="Пароль" required />
                    <div class="error" id="adminLoginError">Неверный логин или пароль</div>
                    <div class="attempts" id="adminLoginAttempts"></div>
                    <button type="submit" class="btn" id="loginSubmitBtn"><i class="fas fa-lock"></i> Войти</button>
                </form>
                <a href="/studio1/" class="back-link"><i class="fas fa-arrow-left"></i> На главную</a>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div class="glass-card">
                <div class="admin-header">
                    <div>
                        <h2>⚙️ Админ-панель <span class="gold-text">Студия №1</span></h2>
                        <p style="color:var(--text-muted);">Управление сайтом</p>
                    </div>
                    <div class="admin-actions">
                        <a href="/studio1/" class="btn btn-sm btn-outline"><i class="fas fa-eye"></i> На сайт</a>
                        <button class="btn btn-sm btn-danger" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Выйти</button>
                    </div>
                </div>

                <div class="admin-tabs" id="adminTabs">
                    <div class="admin-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Дашборд</div>
                    <div class="admin-tab" data-tab="masters" onclick="switchTab('masters')">👩‍🎨 Мастера</div>
                    <div class="admin-tab" data-tab="blog" onclick="switchTab('blog')">📝 Блог</div>
                    <div class="admin-tab" data-tab="clients" onclick="switchTab('clients')">👤 Клиенты</div>
                    <div class="admin-tab" data-tab="reviews" onclick="switchTab('reviews')">⭐ Отзывы</div>
                    <div class="admin-tab" data-tab="comments" onclick="switchTab('comments')">💬 Комментарии</div>
                </div>

                <div id="adminContent"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="clientModal">
        <div class="modal">
            <button class="modal-close" onclick="closeClientModal()">&times;</button>
            <div id="clientModalContent"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, addDoc, query, orderBy, where, onSnapshot } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyChHl5eqHX70m5qh8w5oOj261qqnopzp_c",
            authDomain: "studio1-kemerovo.firebaseapp.com",
            projectId: "studio1-kemerovo",
            storageBucket: "studio1-kemerovo.firebasestorage.app",
            messagingSenderId: "77088698787",
            appId: "1:77088698787:web:fbfc913ad078a1bbe5ea16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_CREDENTIALS = {
            login: 'Studio1Admin',
            password: 'K3m3r0v0#2026Secure!'
        };

        let loginAttempts = 0;
        const MAX_ATTEMPTS = 5;
        const BLOCK_TIME = 5 * 60 * 1000;
        let blockUntil = null;

        function isBlocked() {
            if (!blockUntil) return false;
            if (Date.now() > blockUntil) { blockUntil = null; loginAttempts = 0; return false; }
            return true;
        }

        window.adminLogin = function(e) {
            e.preventDefault();
            if (isBlocked()) {
                document.getElementById('adminLoginAttempts').textContent = '⛔ Заблокировано. Подождите.';
                document.getElementById('adminLoginAttempts').style.display = 'block';
                return;
            }

            const login = document.getElementById('adminLoginInput').value.trim();
            const password = document.getElementById('adminPasswordInput').value.trim();
            const errorEl = document.getElementById('adminLoginError');
            const attemptsEl = document.getElementById('adminLoginAttempts');

            if (login === ADMIN_CREDENTIALS.login && password === ADMIN_CREDENTIALS.password) {
                loginAttempts = 0;
                blockUntil = null;
                errorEl.style.display = 'none';
                attemptsEl.style.display = 'none';

                const sessionData = btoa(JSON.stringify({
                    login: ADMIN_CREDENTIALS.login,
                    timestamp: Date.now()
                }));
                sessionStorage.setItem('admin_session', sessionData);

                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';

                loadAllData();
                renderContent('dashboard');
            } else {
                loginAttempts++;
                const remaining = MAX_ATTEMPTS - loginAttempts;
                if (loginAttempts >= MAX_ATTEMPTS) {
                    blockUntil = Date.now() + BLOCK_TIME;
                    attemptsEl.textContent = '⛔ Заблокировано на 5 минут';
                    attemptsEl.style.display = 'block';
                    setTimeout(() => {
                        attemptsEl.style.display = 'none';
                        loginAttempts = 0;
                        blockUntil = null;
                    }, BLOCK_TIME);
                } else {
                    errorEl.textContent = `Неверно. Осталось: ${remaining}`;
                    errorEl.style.display = 'block';
                }
                document.getElementById('adminPasswordInput').value = '';
            }
        };

        function checkSession() {
            const sessionData = sessionStorage.getItem('admin_session');
            if (sessionData) {
                try {
                    const parsed = JSON.parse(atob(sessionData));
                    if (parsed.login === ADMIN_CREDENTIALS.login && Date.now() - parsed.timestamp < 24 * 60 * 60 * 1000) {
                        document.getElementById('loginPage').style.display = 'none';
                        document.getElementById('adminPanel').style.display = 'block';
                        return true;
                    }
                } catch (e) { sessionStorage.removeItem('admin_session'); }
            }
            return false;
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        async function loadAllData() {
            if (isDataLoaded) return;
            try {
                const mastersSnap = await getDocs(collection(db, 'masters'));
                allMasters = [];
                mastersSnap.forEach(d => allMasters.push({ id: d.id, ...d.data() }));

                allServices = [];
                allMasters.forEach(m => {
                    if (m.services) {
                        m.services.forEach(s => {
                            allServices.push({ ...s, masterName: m.name, masterId: m.id });
                        });
                    }
                });

                const blogSnap = await getDocs(query(collection(db, 'blog'), orderBy('date', 'desc')));
                allBlogPosts = [];
                blogSnap.forEach(d => allBlogPosts.push({ id: d.id, ...d.data() }));

                const usersSnap = await getDocs(collection(db, 'users'));
                allUsers = [];
                usersSnap.forEach(d => allUsers.push({ id: d.id, ...d.data() }));

                const reviewsSnap = await getDocs(query(collection(db, 'reviews'), orderBy('createdAt', 'desc')));
                allReviews = [];
                reviewsSnap.forEach(d => allReviews.push({ id: d.id, ...d.data() }));

                loadComments();
                isDataLoaded = true;
            } catch (e) {
                console.error('Ошибка загрузки:', e);
            }
        }

        function loadComments() {
            commentListeners.forEach(unsub => unsub());
            commentListeners = [];
            // Без orderBy — сортировка на клиенте
            const commentsQuery = query(collection(db, 'comments'));
            const unsubscribe = onSnapshot(commentsQuery, (snapshot) => {
                allComments = [];
                snapshot.forEach(doc => allComments.push({ id: doc.id, ...doc.data() }));
                
                // Сортировка на клиенте
                allComments.sort((a, b) => {
                    const getTime = (c) => {
                        if (!c.createdAt) return 0;
                        if (c.createdAt.toMillis) return c.createdAt.toMillis();
                        if (c.createdAt.seconds) return c.createdAt.seconds * 1000;
                        return new Date(c.createdAt).getTime() || 0;
                    };
                    return getTime(b) - getTime(a);
                });

                if (currentTab === 'comments') renderContent('comments');
            });
            commentListeners.push(unsubscribe);
        }

        window.addService = async function(masterId) {
            const name = document.getElementById(`newServiceName_${masterId}`).value.trim();
            const category = document.getElementById(`newServiceCategory_${masterId}`).value.trim() || 'Услуга';
            const price = parseInt(document.getElementById(`newServicePrice_${masterId}`).value) || 0;
            const duration = document.getElementById(`newServiceDuration_${masterId}`).value.trim() || '1 ч';
            if (!name) { alert('Введите название'); return; }
            const master = allMasters.find(m => m.id === masterId);
            const services = master.services || [];
            services.push({ name, category, price, duration });
            await updateDoc(doc(db, 'masters', masterId), { services });
            await reloadMasters();
            renderContent('masters');
        };

        window.removeService = async function(masterId, index) {
            const master = allMasters.find(m => m.id === masterId);
            if (!confirm(`Удалить "${master.services[index].name}"?`)) return;
            const services = master.services.filter((_, i) => i !== index);
            await updateDoc(doc(db, 'masters', masterId), { services });
            await reloadMasters();
            renderContent('masters');
        };

            const snap = await getDocs(collection(db, 'masters'));
            allMasters = [];
            snap.forEach(d => allMasters.push({ id: d.id, ...d.data() }));
            allServices = [];
            allMasters.forEach(m => {
                if (m.services) m.services.forEach(s => allServices.push({ ...s, masterName: m.name, masterId: m.id }));

            const fileInput = document.getElementById('newBlogImage');

                publishBtn.parentNode.replaceChild(newBtn, publishBtn);

        window.addBlog = async function() {
            const title = document.getElementById('newBlogTitle').value.trim();
            const content = document.getElementById('newBlogContent').value.trim();
            const fileInput = document.getElementById('newBlogImage');
            const status = document.getElementById('newBlogStatus').value;
            if (!title || !content) { alert('Заполните заголовок и текст'); return; }

            let imageData = '';
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                if (file.size > 300 * 1024) { alert('Файл слишком большой (макс 300KB)'); return; }
                imageData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            try {
                await addDoc(collection(db, 'blog'), {
                    title, content, image: imageData, status,
                    date: new Date().toISOString()
                });
                await reloadBlog();
                renderContent('blog');
                alert('✅ Пост опубликован!');
            } catch (e) { alert('❌ Ошибка: ' + e.message); }
        };

            renderContent('blog');

        window.showClient = async function(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            const modal = document.getElementById('clientModal');
            const content = document.getElementById('clientModalContent');

            const history = user.history || [];
            const profileHistory = user.profileHistory || [];
            const userComments = allComments.filter(c => c.userId === userId && !c.isDeleted);
            const userReviews = allReviews.filter(r => r.userId === userId);

            const photo = user.photoURL || '';

            let historyHtml = history.length
                ? history.slice().reverse().map(h => `
                    <div class="history-item">
                        <span>${formatDate(h.date)} — ${escapeHTML(h.action)}</span>
                        <span class="${h.spent ? 'spent' : 'added'}" style="${h.spent ? 'color:#E74C3C;' : 'color:#27AE60;'}">${h.spent ? '-' : '+'}${Math.abs(h.spent || h.added || 0)} мин</span>
                    </div>
                `).join('')
                : `<p style="color:var(--text-muted);font-size:13px;">История пуста</p>`;

            // История изменений профиля
            let profileHistoryHtml = profileHistory.length
                ? profileHistory.slice().reverse().map(h => `
                    <div class="history-item" style="display:block;">
                        <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">${formatDate(h.date)}</div>
                        <div style="font-size:13px;">${h.changes.map(c => `<span style="color:var(--gold);">${c.field}:</span> ${escapeHTML(c.old || '—')} → <strong>${escapeHTML(c.new || '—')}</strong>`).join('<br>')}</div>
                    </div>
                `).join('')
                : `<p style="color:var(--text-muted);font-size:13px;">История изменений пуста</p>`;

            content.innerHTML = `
                <h2>👤 <span class="gold-text">${escapeHTML(user.name || 'Без имени')}</span></h2>
                <p class="subtitle">Полная информация о клиенте</p>

                <div style="text-align:center;margin-bottom:20px;">
                    <div class="avatar-cell" style="width:100px;height:100px;margin:0 auto;font-size:40px;">
                        ${photo ? `<img src="${photo}" />` : (user.name || '?').charAt(0).toUpperCase()}
                    </div>
                </div>

                <div class="info-row"><span class="label">📇 ID карты</span><span class="value"><code style="color:var(--gold);">${escapeHTML(user.cardId || '—')}</code></span></div>
                <div class="info-row"><span class="label">📞 Телефон</span><span class="value">${escapeHTML(user.phone || '—')}</span></div>
                <div class="info-row"><span class="label">✉️ Email</span><span class="value">${escapeHTML(user.email || '—')}</span></div>
                <div class="info-row"><span class="label">☀️ Баланс</span><span class="value" style="font-size:24px;color:var(--gold);">${user.minutes || 0}</span></div>
                <div class="info-row"><span class="label">💬 Комментариев</span><span class="value">${userComments.length}</span></div>
                <div class="info-row"><span class="label">⭐ Отзывов</span><span class="value">${userReviews.length}</span></div>
                
                <h4 style="margin-top:20px;margin-bottom:8px;">🔄 История изменений профиля</h4>
                <div class="history-list">${profileHistoryHtml}</div>
                
                <h4 style="margin-top:20px;margin-bottom:8px;">📜 История операций</h4>
                <div class="history-list">${historyHtml}</div>
                
                <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-sm btn-success" onclick="closeClientModal();addMinutes('${user.id}')"><i class="fas fa-plus"></i> Пополнить</button>
                    <button class="btn btn-sm btn-danger" onclick="closeClientModal();spendMinutes('${user.id}')"><i class="fas fa-minus"></i> Списать</button>
                    <button class="btn btn-sm btn-outline" onclick="closeClientModal()">Закрыть</button>
                </div>
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeClientModal = function() {
            document.getElementById('clientModal').classList.remove('active');
            document.body.style.overflow = '';
        };

        window.addMinutes = async function(userId) {
            const amount = prompt('Сколько минут добавить?', '30');
            if (!amount) return;
            const num = parseInt(amount);
            if (isNaN(num) || num <= 0) { alert('Введите число > 0'); return; }
            const userRef = doc(db, 'users', userId);
            const snap = await getDoc(userRef);
            const data = snap.data();
            const newMinutes = (data.minutes || 0) + num;
            const history = data.history || [];
            history.push({ date: new Date().toISOString(), action: `Пополнение на ${num} мин`, added: num, remaining: newMinutes });
            await updateDoc(userRef, { minutes: newMinutes, history });
            await reloadUsers();
            renderContent('clients');
            alert(`✅ Добавлено ${num} мин. Баланс: ${newMinutes}`);
        };

        window.spendMinutes = async function(userId) {
            const userRef = doc(db, 'users', userId);
            const snap = await getDoc(userRef);
            const data = snap.data();
            const current = data.minutes || 0;
            if (current <= 0) { alert('❌ 0 минут'); return; }
            const amount = prompt(`Списать (доступно: ${current})`, '10');
            if (!amount) return;
            const num = parseInt(amount);
            if (isNaN(num) || num <= 0 || num > current) { alert('Неверное число'); return; }
            const newMinutes = current - num;
            const history = data.history || [];
            history.push({ date: new Date().toISOString(), action: `Списание ${num} мин`, spent: num, remaining: newMinutes });
            await updateDoc(userRef, { minutes: newMinutes, history });
            await reloadUsers();
            renderContent('clients');
            alert(`✅ Списано ${num} мин. Баланс: ${newMinutes}`);
        };

        async function reloadUsers() {
            const snap = await getDocs(collection(db, 'users'));
            allUsers = [];
            snap.forEach(d => allUsers.push({ id: d.id, ...d.data() }));
        }

        // ============================================================
        // REVIEWS ADMIN
        // ============================================================
        function renderReviewsAdmin() {
            const total = allReviews.length;
            const avgRating = total > 0 ? (allReviews.reduce((sum, r) => sum + (r.rating || 0), 0) / total).toFixed(1) : '0.0';
            const salonReviews = allReviews.filter(r => !r.masterId || r.masterId === '');
            const masterReviews = allReviews.filter(r => r.masterId && r.masterId !== '');
            const uniqueAuthors = new Set(allReviews.map(r => r.userId)).size;

            let html = `
                <div class="reviews-stats">
                    <div class="stat-card">
                        <span class="stat-icon">⭐</span>
                        <div class="stat-number">${total}</div>
                        <div class="stat-label">Всего отзывов</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">📊</span>
                        <div class="stat-number">${avgRating}</div>
                        <div class="stat-label">Средний рейтинг</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">👤</span>
                        <div class="stat-number">${uniqueAuthors}</div>
                        <div class="stat-label">Авторов</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">🏢</span>
                        <div class="stat-number">${salonReviews.length}</div>
                        <div class="stat-label">О салоне</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">👨‍🎨</span>
                        <div class="stat-number">${masterReviews.length}</div>
                        <div class="stat-label">О мастерах</div>
                    </div>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead><tr><th>Фото</th><th>Пользователь</th><th>Оценка</th><th>Отзыв</th><th>Тип</th><th>Дата</th><th>Действия</th></tr></thead>
                        <tbody>
            `;

            if (allReviews.length === 0) {
                html += `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px 0;">Нет отзывов</td></tr>`;
            } else {
                for (const r of allReviews) {
                    const stars = '★'.repeat(r.rating || 0) + '☆'.repeat(5 - (r.rating || 0));
                    const isMasterReview = r.masterId && r.masterId !== '';
                    const typeLabel = isMasterReview ? `👤 ${escapeHTML(r.masterName || 'Мастер')}` : '🏢 О салоне';
                    const photo = r.userPhoto || '';
                    
                    html += `
                        <tr>
                            <td>
                                <div class="avatar-cell">
                                    ${photo ? `<img src="${photo}" />` : (r.userName || '?').charAt(0).toUpperCase()}
                                </div>
                            </td>
                            <td>
                                <div style="font-weight:500;">${escapeHTML(r.userName || 'Аноним')}</div>
                                <div style="font-size:11px;color:var(--text-muted);">${escapeHTML(r.userEmail || '')}</div>
                                <div style="font-size:11px;color:var(--text-muted);">📱 ${escapeHTML(r.userPhone || '—')}</div>
                            </td>
                            <td><div class="review-rating-stars">${stars}</div></td>
                            <td style="max-width:200px;word-wrap:break-word;">${escapeHTML(r.text || '')}</td>
                            <td><span style="font-size:12px;">${typeLabel}</span></td>
                            <td style="font-size:12px;white-space:nowrap;">${formatDate(r.createdAt)}</td>
                            <td>
                                <div style="display:flex;gap:4px;">
                                    <button class="btn btn-sm btn-outline" onclick="showUserFromReview('${r.userId}')" title="Инфо"><i class="fas fa-user"></i></button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteReview('${r.id}')" title="Удалить"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            }
            html += `</tbody></table></div>`;
            return html;
        }

        window.showUserFromReview = function(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { alert('Пользователь не найден'); return; }
            showClient(userId);
        };

        window.deleteReview = async function(reviewId) {
            if (!confirm('Удалить отзыв?')) return;
            await deleteDoc(doc(db, 'reviews', reviewId));
            allReviews = allReviews.filter(r => r.id !== reviewId);
            renderContent('reviews');
            alert('✅ Отзыв удалён');
        };

        // ============================================================
        // COMMENTS ADMIN — исправленный фильтр
        // ============================================================
        function renderCommentsAdmin() {
            let filtered = [...allComments];
            
            if (commentsFilter === 'deleted') {
                filtered = filtered.filter(c => c.isDeleted === true);
            } else if (commentsFilter === 'active') {
                filtered = filtered.filter(c => c.isDeleted !== true);
            }

            const totalComments = allComments.length;
            const activeComments = allComments.filter(c => !c.isDeleted).length;
            const deletedComments = allComments.filter(c => c.isDeleted).length;

            const postIds = [...new Set(allComments.map(c => c.postId).filter(Boolean))];
            const postOptions = postIds.map(id => {
                const post = allBlogPosts.find(p => p.id === id);
                return post ? `<option value="${id}">${escapeHTML(post.title || 'Без названия')}</option>` : '';
            }).join('');

            let html = `
                <div class="reviews-stats">
                    <div class="stat-card">
                        <span class="stat-icon">💬</span>
                        <div class="stat-number">${totalComments}</div>
                        <div class="stat-label">Всего</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">✅</span>
                        <div class="stat-number">${activeComments}</div>
                        <div class="stat-label">Активных</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">🗑️</span>
                        <div class="stat-number">${deletedComments}</div>
                        <div class="stat-label">Удалённых</div>
                    </div>
                </div>

                <div class="post-filter">
                    <select onchange="changeCommentsFilter(this.value)">
                        <option value="all" ${commentsFilter === 'all' ? 'selected' : ''}>📋 Все</option>
                        <option value="active" ${commentsFilter === 'active' ? 'selected' : ''}>✅ Активные</option>
                        <option value="deleted" ${commentsFilter === 'deleted' ? 'selected' : ''}>🗑️ Удалённые</option>
                    </select>
                    <select id="commentsPostFilter" onchange="changeCommentsPost(this.value)">
                        <option value="all">📰 Все посты</option>
                        ${postOptions}
                    </select>
                    <span style="color:var(--text-muted);font-size:13px;margin-left:auto;">${filtered.length} комментариев</span>
                </div>

                <div class="comments-table-wrapper">
                    <table class="comments-table">
                        <thead>
                            <tr>
                                <th>Фото</th>
                                <th>Пользователь</th>
                                <th>Комментарий</th>
                                <th>Пост</th>
                                <th>Дата</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (filtered.length === 0) {
                html += `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px 0;">Нет комментариев</td></tr>`;
            } else {
                for (const c of filtered) {
                    const post = allBlogPosts.find(p => p.id === c.postId);
                    const postTitle = post ? post.title : 'Пост удалён';
                    const isDeleted = c.isDeleted === true;
                    const userName = c.userName || 'Аноним';
                    const photo = c.userPhoto || '';

                    html += `
                        <tr>
                            <td>
                                <div class="avatar-cell">
                                    ${photo ? `<img src="${photo}" />` : userName.charAt(0).toUpperCase()}
                                </div>
                            </td>
                            <td>
                                <div style="font-weight:500;">${escapeHTML(userName)}</div>
                                <div style="font-size:11px;color:var(--text-muted);">${escapeHTML(c.userEmail || '')}</div>
                            </td>
                            <td class="comment-text-cell">${isDeleted ? '<i>Удалён</i>' : escapeHTML(c.text || '')}</td>
                            <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(postTitle)}</td>
                            <td style="font-size:12px;white-space:nowrap;">${formatDate(c.createdAt)}</td>
                            <td><span class="badge ${isDeleted ? 'deleted' : 'active'}">${isDeleted ? '🗑️' : '✅'}</span></td>
                            <td>
                                <div style="display:flex;gap:4px;">
                                    ${!isDeleted ? `
                                        <button class="btn btn-sm btn-danger" onclick="deleteCommentAdmin('${c.id}')" style="padding:2px 8px;font-size:10px;min-height:24px;"><i class="fas fa-trash"></i></button>
                                    ` : `
                                        <button class="btn btn-sm btn-success" onclick="restoreCommentAdmin('${c.id}')" style="padding:2px 8px;font-size:10px;min-height:24px;"><i class="fas fa-undo"></i></button>
                                    `}
                                    <button class="btn btn-sm btn-outline" onclick="showCommentUser('${c.userId}')" style="padding:2px 8px;font-size:10px;min-height:24px;"><i class="fas fa-user"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            }
            html += `</tbody></table></div>`;
            return html;
        }

        window.changeCommentsFilter = function(value) {
            commentsFilter = value;
            renderContent('comments');
        };

        window.changeCommentsPost = function(value) {
            // Фильтр по посту — просто перерисовываем
            const select = document.getElementById('commentsPostFilter');
            if (select) select.value = value;
            renderContent('comments');
            setTimeout(() => {
                const newSelect = document.getElementById('commentsPostFilter');
                if (newSelect) newSelect.value = value;
            }, 50);
        };

        window.deleteCommentAdmin = async function(commentId) {
            if (!confirm('Удалить комментарий?')) return;
            await updateDoc(doc(db, 'comments', commentId), {
                isDeleted: true,
                text: '[Комментарий удалён администратором]'
            });
        };

        window.restoreCommentAdmin = async function(commentId) {
            if (!confirm('Восстановить?')) return;
            await updateDoc(doc(db, 'comments', commentId), { isDeleted: false });
        };

        window.showCommentUser = function(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { alert('Не найден'); return; }
            showClient(userId);
        };

        // ============================================================
        // UTILITIES
        // ============================================================
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(date) {
            if (!date) return '';
            try {
                const d = date instanceof Date ? date : new Date(date);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
                    ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            } catch { return ''; }
        }

        // ============================================================
        // START
        // ============================================================
        const hasSession = checkSession();
        if (!hasSession) {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'none';
        } else {
            await loadAllData();
            renderContent('dashboard');
        }

        console.log('🔐 Админка загружена!');
    </script>
</body>
</html>
